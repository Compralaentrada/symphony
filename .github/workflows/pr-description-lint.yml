name: pr-description-lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  validate-pr-title-and-description:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Install Mix dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      # Existing drafts are checked when readied; title edits are checked immediately.
      - name: Validate PR title format
        if: >-
          github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'ready_for_review' ||
          github.event.changes.title != null
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: mix title.check --title "$PR_TITLE"

      - name: Validate PR description format
        env:
          PR_BODY_JSON: ${{ toJson(github.event.pull_request.body) }}
        run: |
          printf '%s' "$PR_BODY_JSON" | jq -r '.' > /tmp/pr_body.md
          mix pr_body.check --file /tmp/pr_body.md
